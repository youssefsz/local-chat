name: Build supported installers
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - name: Windows x64 unsigned
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - name: Version and release contract
        run: |
          python tools/check_public_tree.py
          python tools/check_docs.py
          python tools/release.py check
          python tools/run_tests.py contracts --report artifacts/test-reports/contracts.json
      - name: Frontend checks and production assets
        run: |
          npm run check
          npm run build
      - name: Rust format, lint, and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          python tools/run_tests.py rust --report artifacts/test-reports/rust.json
      - name: Verify updater signature rejection
        run: python tools/run_tests.py signatures --report artifacts/test-reports/signatures.json
      - name: Clean generated installers restored from cache
        run: python tools/prepare_artifacts.py '${{ matrix.platform }}' --clean
      - name: macOS Bonjour recovery regression
        if: runner.os == 'macOS'
        run: python tools/run_tests.py bonjour --report artifacts/test-reports/bonjour.json
      - name: Prepare macOS release identity
        if: inputs.release && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python tools/macos_ci_signing.py
      - name: Require updater signing identity for releases
        if: inputs.release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python -c "import os; assert os.environ.get('TAURI_SIGNING_PRIVATE_KEY'), 'Configure the updater signing identity first'"
      - name: Build signed and notarized macOS release
        if: inputs.release && runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --ci --target "${{ matrix.target }}" --config "$RUNNER_TEMP/local-chat-signing.json"
      - name: Notarize and verify the signed DMG download
        if: inputs.release && runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python tools/notarize_dmg.py
      - name: Build CI installer or unsigned Windows/Linux release
        if: ${{ !inputs.release || runner.os != 'macOS' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          updater=()
          if [[ '${{ inputs.release }}' == 'true' ]]; then updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          npm run tauri build -- --ci --target "${{ matrix.target }}" "${updater[@]}"
      - name: Verify production binary and installers
        run: |
          signed=()
          if [[ '${{ inputs.release }}' == 'true' && '${{ runner.os }}' == 'macOS' ]]; then signed=(--signed-macos); fi
          if [[ '${{ inputs.release }}' == 'true' ]]; then signed+=(--updater); fi
          python tools/prepare_artifacts.py '${{ matrix.platform }}' "${signed[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.platform }}
          path: artifacts/test-reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always() && inputs.release && runner.os == 'macOS'
        run: |
          if [[ -f "$RUNNER_TEMP/local-chat-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/local-chat-release.keychain-db"
          fi
