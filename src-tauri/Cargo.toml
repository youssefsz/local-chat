[package]
name = "local-chat"
version = "0.1.0-beta.3"
edition = "2024"
rust-version = "1.93"
default-run = "local-chat"
license = "MIT"

[lib]
name = "local_chat"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-opener"]
test-profile = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rcgen = { version = "0.14", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
if-addrs = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri = { package = "tauri", version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = false
debug = 1

[[example]]
name = "local-chat-peer"
path = "examples/peer.rs"
required-features = ["test-profile"]

[[example]]
name = "local-chat-bench"
path = "examples/bench.rs"
required-features = ["test-profile"]

[profile.release.build-override]
strip = false
debug = 1

[[example]]
name = "local-chat-fixture"
path = "examples/fixture.rs"
required-features = ["test-profile"]

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
netdev = "=0.46.3"
mdns-sd = { version = "=0.21.5", default-features = false, features = ["async"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Networking_WinSock"] }
